<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub同步工作任务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
            background: #f5f7fa;
        }
        .title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .config-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .config-box input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .task-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .task-box {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .task-box h3 {
            color: #3498db;
            margin-bottom: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        .add-task {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .add-task input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .del-btn {
            color: #e74c3c;
            border: none;
            background: none;
            cursor: pointer;
        }
        .sync-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #3498db;
            color: white;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .backup-btn {
            background: #27ae60;
        }
        .sync-btn {
            background: #9b59b6;
        }
        .tip {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1 class="title">📅 GitHub同步工作安排</h1>

    <!-- GitHub配置区域 -->
    <div class="config-box">
        <h3>⚙️ GitHub配置（仅首次填写）</h3>
        <input type="text" id="token" placeholder="GitHub个人访问令牌（勾选repo权限）">
        <input type="text" id="username" placeholder="GitHub用户名（如：zhangsan）">
        <input type="text" id="repo" placeholder="GitHub仓库名（如：task-store）">
        <input type="text" id="filename" placeholder="存储文件名（默认：tasks.json）" value="tasks.json">
    </div>

    <!-- 同步按钮 -->
    <div class="sync-btns">
        <button class="backup-btn" onclick="backupToGitHub()">💾 备份任务到GitHub</button>
        <button class="sync-btn" onclick="syncFromGitHub()">🔄 从GitHub同步任务</button>
    </div>

    <!-- 任务区域 -->
    <div class="task-section">
        <!-- 今日任务 -->
        <div class="task-box">
            <h3>今日工作安排</h3>
            <div class="add-task">
                <input type="text" id="todayInput" placeholder="输入今日工作内容">
                <button onclick="addTask('today')">添加</button>
            </div>
            <ul class="task-list" id="todayList"></ul>
        </div>

        <!-- 未来任务 -->
        <div class="task-box">
            <h3>未来工作安排</h3>
            <div class="add-task">
                <input type="text" id="futureInput" placeholder="输入未来工作内容">
                <button onclick="addTask('future')">添加</button>
            </div>
            <ul class="task-list" id="futureList"></ul>
        </div>
    </div>

    <p class="tip">数据存储在你的GitHub仓库，换设备只需输入相同配置即可同步</p>

    <script>
        // 初始化任务数据
        let taskData = {
            today: [],
            future: []
        };

        // 页面加载时渲染本地任务
        window.onload = renderTasks;

        // 添加任务
        function addTask(type) {
            const input = document.getElementById(`${type}Input`);
            const content = input.value.trim();
            if (!content) return;
            
            taskData[type].push(content);
            input.value = '';
            renderTasks();
        }

        // 删除任务
        function deleteTask(type, index) {
            taskData[type].splice(index, 1);
            renderTasks();
        }

        // 渲染任务到页面
        function renderTasks() {
            // 渲染今日任务
            const todayList = document.getElementById('todayList');
            todayList.innerHTML = taskData.today.map((item, index) => `
                <li class="task-item">
                    ${item}
                    <button class="del-btn" onclick="deleteTask('today', ${index})">×</button>
                </li>
            `).join('');

            // 渲染未来任务
            const futureList = document.getElementById('futureList');
            futureList.innerHTML = taskData.future.map((item, index) => `
                <li class="task-item">
                    ${item}
                    <button class="del-btn" onclick="deleteTask('future', ${index})">×</button>
                </li>
            `).join('');
        }

        // ---------------------- GitHub同步核心逻辑 ----------------------
        // 获取GitHub配置
        function getGitHubConfig() {
            return {
                token: document.getElementById('token').value,
                username: document.getElementById('username').value,
                repo: document.getElementById('repo').value,
                filename: document.getElementById('filename').value
            };
        }

        // 备份任务到GitHub
        async function backupToGitHub() {
            const { token, username, repo, filename } = getGitHubConfig();
            if (!token || !username || !repo) {
                alert('请先填写完整GitHub配置！');
                return;
            }

            try {
                // 1. 先获取文件SHA（更新文件必需）
                let sha = '';
                try {
                    const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${filename}`, {
                        headers: { Authorization: `token ${token}` }
                    });
                    const data = await res.json();
                    sha = data.sha;
                } catch (e) {}

                // 2. 上传任务数据
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(taskData))));
                const uploadRes = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${filename}`, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '备份工作任务',
                        content: content,
                        sha: sha
                    })
                });

                if (uploadRes.ok) alert('✅ 备份成功！任务已保存到GitHub');
                else alert('❌ 备份失败，请检查配置');
            } catch (e) {
                alert('备份出错：' + e.message);
            }
        }

        // 从GitHub同步任务
        async function syncFromGitHub() {
            const { token, username, repo, filename } = getGitHubConfig();
            if (!token || !username || !repo) {
                alert('请先填写完整GitHub配置！');
                return;
            }

            try {
                // 拉取GitHub文件数据
                const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${filename}`, {
                    headers: { Authorization: `token ${token}` }
                });
                const data = await res.json();
                
                // 解码并加载任务
                const taskStr = decodeURIComponent(escape(atob(data.content)));
                taskData = JSON.parse(taskStr);
                renderTasks();
                alert('✅ 同步成功！已加载最新任务');
            } catch (e) {
                alert('同步失败：未找到任务文件或配置错误');
            }
        }
    </script>
</body>
</html>
