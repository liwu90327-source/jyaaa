<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服饰普货个人销售汇总</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f7f9fc;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .desc {
            text-align: center;
            color: #718094;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .upload-box {
            border: 2px dashed #429eE1;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafbfc;
            margin-bottom: 25px;
        }
        .upload-box:hover {
            background-color: #f7fafc;
        }
        .upload-box.active {
            border-color: #2b6cb3;
            background-color: #ebf8ff;
        }
        .chart-box {
            margin: 30px 0;
            height: 500px;
            width: 100%;
        }
        #file-input {
            display: none;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #429eE1;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #2b6cb3;
        }
        .btn.secondary {
            background-color: #38a169;
        }
        .btn.secondary:hover {
            background-color: #2f855a;
        }
        .btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        .result-box {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            min-height: 150px;
            border: 1px solid #e2e8f0;
            max-height: 800px;
            overflow-y: auto;
        }
        .result-title {
            font-size: 16px;
            color: #2d3748;
            margin-bottom: 12px;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: #f8f9fa;
            padding: 5px 0;
        }
        #result-content {
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            color: #4a5568;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>SKU数量统计（服饰普货个人销售汇总5.25版）</h2>
        <p class="desc">智能合并订单 | 全店单品汇总 | 印花T恤自动归类 | 饼状图自适应引导线</p>
        
        <div class="upload-box" id="upload-box">
            <input type="file" id="file-input" accept=".xlsx,.xls">
            <div class="icon">📂</div>
            <p>点击选择文件 或 直接将Excel文件拖入此处</p>
        </div>

        <div class="btn-group">
            <button class="btn" id="copy-full-btn" disabled>复制完整结果</button>
            <button class="btn secondary" id="copy-sku-btn" disabled>仅复制SKU结果</button>
        </div>

        <div class="chart-box">
            <canvas id="skuChart"></canvas>
        </div>

        <div class="result-box">
            <div class="result-title">统计结果：</div>
            <div id="result-content">等待上传文件...</div>
        </div>
    </div>

    <script>
        const skuNameMap = {
            "FYS-YHDK": "印花短裤(计光板短裤)", "FYS-GJTX": "光板高价", "FYS-HFG": "华夫格",
            "FYS-HFG-B": "B字华夫格", "FYS-CK": "B字母长裤", "FYS-DXRCK": "灯芯绒长裤",
            "FYS-YWCK": "英文长裤", "FYS-ZDCK": "织带长裤", "FYS-LLCK": "拉链长裤",
            "FYS-TLCK": "弹力裤", "FYS-ZDDK": "链条短裤", "FYS-KCDK": "光板短裤",
            "FYS-JK": "夹克", "FYS-NK": "内裤", "FYS-UECK": "UE裤", "FYS-HFGDK": "华夫格短裤",
            "FYS-FSMZ": "防晒面罩", "FYS-FMWK": "休闲长裤", "FYS-YDDK": "运动短裤",
            "FYS-TWCK": "条纹长裤", "FYS-HFGCK": "华夫格长裤", "FYS-QXF": "骑行服",
            "FYS-LQTZ": "篮球套装", "FYS-KTK": "阔腿裤", "FYS-GYK": "高腰裤",
            "FYS-YDW-4S": "运动袜低", "FYS-YDW-4M": "运动袜中", "FYS-YDW-4L": "运动袜高",
            "FYS-THYF": "退货衣服-不计", "FYS-DJTHS": "印花高价-不计", "FYS-YHT": "低价黑白印花T恤-不计",
            "FYS-YDCS": "运动衬衫", "FYS-YJSY": "瑜伽上衣", "FYS-FSY": "防嗮衣", 
            "FYS-HFGCK 1+2": "华夫格长裤3件*个数=总个数"
        };

        const customSortOrder = [
            "FYS-GJTX","FYS-HFG","FYS-HFG-B","FYS-CK","FYS-DXRCK","FYS-YWCK","FYS-ZDCK",
            "FYS-LLCK","FYS-TLCK","FYS-ZDDK","FYS-YHDK","FYS-KCDK","FYS-JK","FYS-NK","FYS-UECK","FYS-HFGDK",
            "FYS-FSMZ","FYS-FMWK","FYS-YDDK","FYS-TWCK","FYS-HFGCK","FYS-HFGCK 1+2",
            "FYS-QXF","FYS-LQTZ","FYS-KTK",
            "FYS-GYK","FYS-YDW-4S","FYS-YDW-4M","FYS-YDW-4L","FYS-YDCS","FYS-YJSY","FYS-FSY",
            "FYS-THYF","FYS-DJTHS","FYS-YHT"
        ];

        const excludeStatus = "待审核";
        let fullResult = "", skuOnlyResult = "", totalOrders = 0;
        let globalSkuTotal = {};
        let chart = null;

        const uploadBox = document.getElementById('upload-box');
        const fileInput = document.getElementById('file-input');
        const resultContent = document.getElementById('result-content');
        const copyFullBtn = document.getElementById('copy-full-btn');
        const copySkuBtn = document.getElementById('copy-sku-btn');

        function init() {
            uploadBox.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            uploadBox.addEventListener('dragover', handleDragOver);
            uploadBox.addEventListener('dragleave', handleDragLeave);
            uploadBox.addEventListener('drop', handleDrop);
            copyFullBtn.addEventListener('click', () => copyResult(fullResult, '完整结果'));
            copySkuBtn.addEventListener('click', () => copyResult(skuOnlyResult, 'SKU结果'));
        }

        function handleFileSelect(e) { const file = e.target.files[0]; if (file) processFile(file); }
        function handleDragOver(e) { e.preventDefault(); uploadBox.classList.add('active'); }
        function handleDragLeave(e) { e.preventDefault(); uploadBox.classList.remove('active'); }
        function handleDrop(e) {
            e.preventDefault(); uploadBox.classList.remove('active');
            const file = e.dataTransfer.files[0];
            if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                resultContent.innerText = '错误：仅支持Excel文件'; return;
            }
            processFile(file);
        }

        function getSkuDisplayName(sku) {
            if (skuNameMap[sku]) return skuNameMap[sku];
            if (/^\d{2}/.test(sku)) return "印花T恤";
            return "未知商品";
        }

        // ✅ 自适应饼图：大字放内部，小字/放不下用引导线显示在外
        function renderChart(labels, data) {
            const ctx = document.getElementById('skuChart').getContext('2d');
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'pie',
                plugins: [ChartDataLabels],
                data: { 
                    labels: labels, 
                    datasets: [{ 
                        data: data, 
                        backgroundColor: [
                            '#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF',
                            '#FF9F40','#C9CBCF','#6BCF7F','#FF5733','#9B59B6',
                            '#1ABC9C','#34495E','#E67E22','#8E44AD','#C0392B'
                        ] 
                    }] 
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            position: 'right',
                            labels: { font: { size: 12 } }
                        },
                        title: { 
                            display: true, 
                            text: '全店SKU品类占比饼状图', 
                            font: { size: 16, weight: 'bold' } 
                        },
                        datalabels: {
                            color: '#fff',
                            font: { size: 13, weight: 'bold' },
                            // 自动判断：占比 < 6% 用引导线显示在外，>6% 显示在内
                            display: function(context) {
                                const value = context.dataset.data[context.dataIndex];
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percent = (value / total) * 100;
                                return percent > 0;
                            },
                            formatter: function(value, ctx) {
                                let label = ctx.chart.data.labels[ctx.dataIndex];
                                return label + '：' + value + '个';
                            },
                            anchor: function(context) {
                                const value = context.dataset.data[context.dataIndex];
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percent = (value / total) * 100;
                                return percent >= 6 ? 'center' : 'end';
                            },
                            align: function(context) {
                                const value = context.dataset.data[context.dataIndex];
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percent = (value / total) * 100;
                                return percent >= 6 ? 'center' : 'end';
                            },
                            offset: 15,
                            borderWidth: 1,
                            borderColor: '#fff',
                            borderRadius: 3,
                            backgroundColor: 'rgba(0, 0, 0, 0.7)',
                            padding: 4
                        }
                    }
                }
            });
        }

        function processFile(file) {
            resultContent.innerText = "正在处理数据...";
            copyFullBtn.disabled = true; copySkuBtn.disabled = true;
            totalOrders = 0; globalSkuTotal = {};

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header:1 });

                    const shopMap = {}, globalOrderStatusMap = {};
                    let i=1, currentOrderStatus=null, currentShopName=null;

                    while(i<jsonData.length){
                        const row = jsonData[i]; if(!row){i++;continue;}
                        const D = row[3]?.toString().trim() || '';
                        const I = row[8]?.toString().trim() || '';
                        const G = row[6]?.toString().trim() || '';
                        const H = parseInt(row[7]) || 0;

                        if(D!=='' || I!==''){
                            currentOrderStatus = D || '未知状态';
                            currentShopName = I || '未知店铺';
                            if(!shopMap[currentShopName]) shopMap[currentShopName] = {skuCountMap:{}, orderStatusMap:{}, orderCount:0};
                            const s = shopMap[currentShopName];
                            s.orderStatusMap[currentOrderStatus] = (s.orderStatusMap[currentOrderStatus]||0)+1;
                            s.orderCount++;
                            globalOrderStatusMap[currentOrderStatus] = (globalOrderStatusMap[currentOrderStatus]||0)+1;
                            totalOrders++;
                        }

                        if(G && currentShopName && currentOrderStatus && currentOrderStatus!==excludeStatus && H>0){
                            const sku = G.replace(/\s*1\+1\s*/gi,'').trim();
                            const cnt = G.includes('1+1') ? H*2 : H;
                            const s = shopMap[currentShopName];
                            s.skuCountMap[sku] = (s.skuCountMap[sku]||0)+cnt;
                            globalSkuTotal[sku] = (globalSkuTotal[sku]||0)+cnt;
                        }
                        i++;
                    }

                    const fullArr=[], skuArr=[];
                    const shopNames = Object.keys(shopMap).sort();

                    shopNames.forEach(shop=>{
                        const d=shopMap[shop];
                        fullArr.push(`==================== ${shop}：统计结果 ====================`);
                        skuArr.push(`==================== ${shop}：统计结果 ====================`);
                        const r=[]; const added=new Set();
                        customSortOrder.forEach(s=>{if(d.skuCountMap[s]&&!added.has(s)){r.push(`${s}:${d.skuCountMap[s]}个 (${getSkuDisplayName(s)})`);added.add(s);}});
                        Object.keys(d.skuCountMap).filter(k=>!added.has(k)).sort().forEach(s=>{r.push(`${s}:${d.skuCountMap[s]}个 (${getSkuDisplayName(s)})`);});
                        fullArr.push(r.join('\n')||'无数据'); skuArr.push(r.join('\n')||'无数据');
                        fullArr.push('\n===== 店铺订单状态 =====');
                        for(let st in d.orderStatusMap) fullArr.push(`${st}: ${d.orderStatusMap[st]}单`);
                        fullArr.push(`店铺总订单：${d.orderCount}单\n`);
                    });

                    fullArr.push("==================== 全店订单汇总 ====================");
                    for(let st in globalOrderStatusMap) fullArr.push(`${st}: ${globalOrderStatusMap[st]}单`);
                    fullArr.push(`全店总订单数：${totalOrders}单\n`);

                    // 全店汇总：印花T恤合并显示
                    fullArr.push("==================== 全店单品总数汇总 ====================");
                    const categorySummary = {};
                    for (let sku in globalSkuTotal) {
                        const catName = getSkuDisplayName(sku);
                        categorySummary[catName] = (categorySummary[catName] || 0) + globalSkuTotal[sku];
                    }
                    for (let name in categorySummary) {
                        fullArr.push(`${name}：${categorySummary[name]} 个`);
                    }
                    fullArr.push("==========================================================");

                    // 生成自适应饼图
                    const chartLabels = Object.keys(categorySummary);
                    const chartData = Object.values(categorySummary);
                    renderChart(chartLabels, chartData);

                    fullResult = fullArr.join('\n');
                    skuOnlyResult = skuArr.join('\n');
                    resultContent.innerText = fullResult;
                    copyFullBtn.disabled=false; copySkuBtn.disabled=false;

                }catch(err){ resultContent.innerText="错误："+err.message; }
            };
            reader.readAsArrayBuffer(file);
        }

        function copyResult(text, type) {
            if(!text)return alert('无结果');
            navigator.clipboard.writeText(text).then(()=>alert(`已复制${type}`)).catch(()=>{
                const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
                document.execCommand('copy'); document.body.removeChild(t); alert(`已复制${type}`);
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
